name: Bug
description: Something is broken
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw. Do not include a child's name, a parent's contact details, or any secret.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where?
      description: Page, browser, or phone. Example, home page on Chrome.
    validations:
      required: true
